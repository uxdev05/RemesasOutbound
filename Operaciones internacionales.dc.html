<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/bankaool-design-system-e4a58535-11ab-47ad-9339-673141d69251/colors_and_type.css">
<link rel="stylesheet" href="_ds/bankaool-design-system-e4a58535-11ab-47ad-9339-673141d69251/preview/_preview.css">
<script src="_ds/bankaool-design-system-e4a58535-11ab-47ad-9339-673141d69251/_ds_bundle.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap">
<style>body{font-family:Poppins,sans-serif;margin:0;background:#E5E4E4}a{color:#1E1E23}a:hover{color:#707070}button,input{font-family:inherit}input::placeholder{color:#1E1E23;opacity:1}</style>
</helmet>
<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box;font-family:Poppins,sans-serif">
<div data-screen-label="03 Operaciones internacionales" style="position:relative;width:390px;height:844px;background:#FAFAFA;border-radius:44px;overflow:hidden;box-shadow:0 0 0 1px #E5E4E4,0 24px 60px rgba(30,30,35,.18);color:#1E1E23">
  <div style="position:absolute;inset:0;overflow-y:auto;padding:0 24px 48px;scrollbar-width:none">
    <div style="height:54px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 14px 6px;font-weight:600;font-size:16px;margin:0 -24px">
      <span>9:41</span>
      <span style="display:flex;gap:6px;align-items:center"><svg width="18" height="12" viewBox="0 0 18 12" fill="#1E1E23"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="2.5" width="3" height="9.5" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1" opacity=".3"/></svg><svg width="26" height="12" viewBox="0 0 26 12"><rect x=".5" y=".5" width="22" height="11" rx="3.5" fill="none" stroke="#1E1E23" opacity=".4"/><rect x="2" y="2" width="19" height="8" rx="2" fill="#1E1E23"/></svg></span>
    </div>
    <div style="display:flex;align-items:center;justify-content:space-between;height:56px;margin:0 -12px 0 -12px">
      <a href="Haz mas.dc.html" aria-label="Volver" style="width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:#1E1E23"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></a>
      <div style="display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px">Ayuda
        <button aria-label="WhatsApp" style="all:unset;cursor:pointer;width:32px;height:32px;display:flex;align-items:center;justify-content:center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1E1E23" stroke-width="1.6" stroke-linejoin="round"><path d="M12 3a9 9 0 00-7.700 13.600L3 21l4.500-1.200A9 9 0 1012 3z"/><path d="M9 8.500c0 3.500 3 6.500 6.500 6.500l1-2-2.200-1-1 1c-1-.5-2-1.500-2.500-2.500l1-1-1-2.200z" fill="#1E1E23" stroke="none"/></svg></button>
        <button aria-label="Información" style="all:unset;cursor:pointer;width:32px;height:32px;display:flex;align-items:center;justify-content:center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1E1E23" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="9.500"/><path d="M12 11v5.500M12 7.700v.1"/></svg></button>
      </div>
    </div>
    <h1 style="margin:24px 0 0;font-weight:700;font-size:32px;line-height:40px;letter-spacing:-.01em">Operaciones internacionales</h1>

    <div style="margin-top:32px;border:1.5px solid #1E1E23;border-radius:24px;padding:20px 20px 24px;background:#FAFAFA">
      <div style="display:flex;gap:16px;align-items:flex-start">
        <div style="width:48px;height:48px;flex:none;border-radius:9999px;background:#64F0B6;display:flex;align-items:center;justify-content:center"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#1E1E23" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 11-3-6.200M20 4v4h-4"/><path d="M14.500 10c-.4-.8-1.300-1.200-2.500-1.200-1.400 0-2.300.7-2.300 1.600 0 2.200 4.800 1 4.800 3.200 0 .9-1 1.600-2.500 1.600-1.200 0-2.200-.5-2.500-1.400M12 7.500v1.300m0 6.600V17"/></svg></div>
        <div><div style="font-weight:700;font-size:16px;line-height:24px">Cobrar dinero</div>
        <div style="font-size:14px;line-height:21px;margin-top:2px">Verifica con tu número de seguimiento (MTCN) <svg style="vertical-align:-3px" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1E1E23" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9.500"/><path d="M12 11v5.500M12 7.700v.1"/></svg></div></div>
      </div>
      <div style="display:flex;align-items:center;gap:12px;margin-top:20px">
        <input value="{{ mtcn }}" onInput="{{ setMtcn }}" inputmode="numeric" maxlength="10" placeholder="Ingresa tu MTCN (10 dígitos)" aria-label="MTCN" style="flex:1;min-width:0;height:40px;border:0;border-bottom:1.5px solid #1E1E23;background:transparent;font-size:16px;color:#1E1E23;outline:none;padding:0 0 4px">
        <button onClick="{{ goCobrar }}" disabled="{{ mtcnOff }}" aria-label="Verificar MTCN" style="width:40px;height:40px;flex:none;border-radius:9999px;border:0;cursor:pointer;background:{{ mtcnBg }};color:{{ mtcnFg }};display:flex;align-items:center;justify-content:center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
      </div>
    </div>

    <div style="margin-top:32px;border:1.5px solid #1E1E23;border-radius:24px;padding:20px 20px 24px;background:#FAFAFA">
      <div style="display:flex;gap:16px;align-items:flex-start">
        <div style="width:48px;height:48px;flex:none;border-radius:9999px;background:#AEBCFF;display:flex;align-items:center;justify-content:center"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#1E1E23" stroke-width="1.6" stroke-linejoin="round"><path d="M21 3L3 10.500l7 3 3 7z"/><path d="M10 13.500L21 3"/></svg></div>
        <div><div style="font-weight:700;font-size:16px;line-height:24px">Enviar dinero</div>
        <div style="font-size:14px;line-height:21px;margin-top:2px">Elige el país donde quieres que llegue el dinero</div></div>
      </div>
      <div style="display:flex;align-items:flex-start;gap:12px;margin-top:20px">
        <div style="flex:1;min-width:0;position:relative">
          <button onClick="{{ toggleMenu }}" aria-haspopup="listbox" style="all:unset;box-sizing:border-box;cursor:pointer;width:100%;height:{{ trigH }}px;border:{{ trigBorder }};border-bottom:1.5px solid #1E1E23;border-radius:{{ trigRadius }};display:flex;align-items:center;justify-content:space-between;font-size:16px;padding:{{ trigPad }}"><span>{{ countryLabel }}</span><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1E1E23" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="transform:rotate({{ chevRot }}deg)"><path d="M6 9l6 6 6-6"/></svg></button>
          <sc-if value="{{ menuOpen }}" hint-placeholder-val="{{ false }}">
            <div role="listbox" style="position:absolute;left:0;right:0;top:42px;z-index:5;background:#FAFAFA;border:1.5px solid #1E1E23;border-radius:8px;max-height:150px;overflow-y:auto;padding:4px 0;box-shadow:0 8px 24px rgba(30,30,35,.16)">
              <sc-for list="{{ countries }}" as="c" hint-placeholder-count="5">
                <button role="option" onClick="{{ c.pick }}" style="all:unset;box-sizing:border-box;cursor:pointer;display:block;width:100%;padding:10px 12px;font-size:16px;background:{{ c.bg }};color:{{ c.fg }};border-radius:4px" style-hover="background:#1E1E23;color:#FAFAFA">{{ c.name }}</button>
              </sc-for>
            </div>
          </sc-if>
        </div>
        <button onClick="{{ goSend }}" disabled="{{ countryOff }}" aria-label="Continuar" style="width:40px;height:40px;flex:none;border-radius:9999px;border:0;cursor:pointer;background:{{ countryBg }};color:{{ countryFg }};display:flex;align-items:center;justify-content:center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
      </div>
    </div>

    <div style="margin-top:32px;border:1.5px solid #1E1E23;border-radius:24px;padding:20px;background:#FAFAFA;display:flex;align-items:center;gap:16px">
      <div style="width:48px;height:48px;flex:none;border-radius:9999px;background:#FFD0F4;display:flex;align-items:center;justify-content:center"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#1E1E23" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v7m0 0l-2.500-2.500M12 10l2.500-2.500M4 14v4a2 2 0 002 2h12a2 2 0 002-2v-4a2 2 0 00-2-2H6a2 2 0 00-2 2z"/><circle cx="12" cy="16" r="1.500"/></svg></div>
      <div style="flex:1;font-weight:700;font-size:16px">Últimos movimientos</div>
      <button aria-label="Ver últimos movimientos" style="width:40px;height:40px;flex:none;border-radius:9999px;border:0;cursor:pointer;background:#1E1E23;color:#FAFAFA;display:flex;align-items:center;justify-content:center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
    </div>
  </div>
  <div style="position:absolute;left:50%;bottom:8px;transform:translateX(-50%);width:134px;height:5px;border-radius:9999px;background:#1E1E23"></div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { mtcn: '', country: '', menu: false };
  renderVals() {
    const { mtcn, country, menu } = this.state;
    const ok1 = mtcn.length === 10, ok2 = !!country;
    const names = ['Estados Unidos', 'Colombia', 'Costa Rica', 'Venezuela', 'Guatemala', 'China', 'España'];
    return {
      mtcn,
      setMtcn: e => this.setState({ mtcn: e.target.value.replace(/\D/g, '').slice(0, 10) }),
      mtcnOff: !ok1, mtcnBg: ok1 ? '#1E1E23' : '#E5E4E4', mtcnFg: ok1 ? '#FAFAFA' : '#ADADAD',
      goCobrar: () => {},
      countryLabel: menu ? 'Selecciona un país' : (country || 'Seleccionar país'),
      trigH: menu ? 44 : 40, trigBorder: menu ? '1.5px solid #1E1E23' : '0', trigRadius: menu ? '8px' : '0', trigPad: menu ? '0 12px' : '0 0 4px',
      countryOff: !ok2, countryBg: ok2 ? '#1E1E23' : '#E5E4E4', countryFg: ok2 ? '#FAFAFA' : '#ADADAD',
      menuOpen: menu, chevRot: menu ? 180 : 0,
      toggleMenu: () => this.setState({ menu: !menu }),
      countries: names.map(name => ({ name, bg: name === country ? '#1E1E23' : 'transparent', fg: name === country ? '#FAFAFA' : '#1E1E23', pick: () => this.setState({ country: name, menu: false }) })),
      goSend: () => { sessionStorage.setItem('bk_country', country); window.location.href = 'Ingresa tu monto.dc.html?c=' + encodeURIComponent(country); },
    };
  }
}
</script>
</body>
</html>
