<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/bankaool-design-system-e4a58535-11ab-47ad-9339-673141d69251/colors_and_type.css">
<link rel="stylesheet" href="_ds/bankaool-design-system-e4a58535-11ab-47ad-9339-673141d69251/preview/_preview.css">
<script src="_ds/bankaool-design-system-e4a58535-11ab-47ad-9339-673141d69251/_ds_bundle.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"><style>body{font-family:Poppins,sans-serif;margin:0;background:#E5E4E4}a{color:#1E1E23}a:hover{color:#707070}button{font-family:inherit}</style>
</helmet>
<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box;font-family:Poppins,sans-serif">
<div data-screen-label="01 Home" style="position:relative;width:390px;height:844px;background:#FFFFFF;border-radius:44px;overflow:hidden;box-shadow:0 0 0 1px #E5E4E4,0 24px 60px rgba(43,42,40,.18);color:#1E1E23">
  <div style="position:absolute;inset:0;overflow-y:auto;padding:0 16px 160px;scrollbar-width:none">
    <div style="height:54px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 14px 6px;font-weight:600;font-size:16px;margin:0 -16px 0">
      <span>9:41</span>
      <span style="display:flex;gap:6px;align-items:center"><svg width="18" height="12" viewBox="0 0 18 12" fill="#1E1E23"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="2.5" width="3" height="9.5" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1" opacity=".3"/></svg><svg width="26" height="12" viewBox="0 0 26 12"><rect x=".5" y=".5" width="22" height="11" rx="3.5" fill="none" stroke="#1E1E23" opacity=".4"/><rect x="2" y="2" width="19" height="8" rx="2" fill="#1E1E23"/></svg></span>
    </div>
    <div style="display:flex;align-items:center;justify-content:space-between;margin-top:20px">
      <h1 style="margin:0;font-family:Poppins,sans-serif;font-size:28px;line-height:34px;font-weight:700">Hola, Margarita</h1>
      <div style="display:flex;gap:4px">
        <button onClick="{{ toggleHide }}" aria-label="Ocultar saldo" style="all:unset;cursor:pointer;width:44px;height:44px;display:flex;align-items:center;justify-content:center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1E1E23" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/><path d="M4 20L20 4" opacity="{{ slashOpacity }}"/></svg></button>
        <button aria-label="Notificaciones" style="all:unset;cursor:pointer;width:44px;height:44px;display:flex;align-items:center;justify-content:center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1E1E23" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9a6 6 0 1112 0c0 5 2 6 2 6H4s2-1 2-6z"/><path d="M10 19a2 2 0 004 0"/></svg></button>
      </div>
    </div>
    <div style="display:flex;gap:12px;margin-top:20px">
      <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="3">
        <button onClick="{{ t.pick }}" style="flex:1;height:44px;border-radius:9999px;cursor:pointer;font-size:14px;font-weight:{{ t.weight }};background:{{ t.bg }};color:{{ t.fg }};border:1.5px solid #1E1E23">{{ t.label }}</button>
      </sc-for>
    </div>
    <div style="margin-top:24px;background:#1E1E23;border-radius:32px;padding:24px;color:#FAFAFA">
      <div style="display:flex;align-items:center;justify-content:space-between;font-size:16px">
        <span>{{ account.name }} <span style="color:#ADADAD;margin-left:6px">| ** {{ account.last4 }}</span></span>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="#FAFAFA"><circle cx="12" cy="5" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="12" cy="19" r="1.8"/></svg>
      </div>
      <div style="margin-top:20px;font-family:Poppins,sans-serif;font-weight:700;font-size:34px;line-height:40px;letter-spacing:-.01em">{{ balanceMain }}<span style="font-size:16px;color:#ADADAD;margin-left:2px">{{ balanceCents }}</span></div>
      <div style="display:flex;gap:12px;margin-top:24px">
        <button style="flex:1;height:44px;border-radius:9999px;background:transparent;color:#FAFAFA;border:1.5px solid #FAFAFA;font-weight:700;font-size:14px;cursor:pointer">Retirar</button>
        <button style="flex:1;height:44px;border-radius:9999px;background:#FFFFFF;color:#1E1E23;border:0;font-weight:700;font-size:14px;cursor:pointer">Depositar</button>
      </div>
    </div>
    <div style="display:flex;justify-content:center;margin:16px 0"><span style="width:8px;height:8px;border-radius:9999px;background:#1E1E23"></span></div>
    <div style="display:grid;grid-template-columns:1fr 1px 1fr 1px 1fr;align-items:center;border:1.5px solid #1E1E23;border-radius:20px;padding:16px 4px">
      <button onClick="{{ goSend }}" style="all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:14px;text-align:center;line-height:20px;padding:4px 0"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1E1E23" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7M8 7h9v9"/></svg><span>Enviar<br>dinero</span></button>
      <span style="height:40px;background:#E5E4E4"></span>
      <button style="all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:14px;text-align:center;line-height:20px;padding:4px 0"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1E1E23" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><path d="M14 14h3v3h-3zM20 14v0M14 20h3M20 17v4"/></svg><span>OMNi<br>Pay</span></button>
      <span style="height:40px;background:#E5E4E4"></span>
      <button onClick="{{ goMore }}" style="all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:14px;text-align:center;line-height:20px;padding:4px 0"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1E1E23" stroke-width="1.6"><circle cx="7" cy="7" r="3.5"/><circle cx="17" cy="7" r="3.5"/><circle cx="7" cy="17" r="3.5"/><circle cx="17" cy="17" r="3.5"/></svg><span>Haz<br>más</span></button>
    </div>
    <div style="display:flex;align-items:center;justify-content:space-between;margin-top:32px">
      <h2 style="margin:0;font-family:Poppins,sans-serif;font-size:18px;font-weight:700">Últimos movimientos</h2>
      <a href="#" style="display:flex;align-items:center;gap:6px;font-size:14px;text-decoration:none">Ver todos <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></a>
    </div>
    <div style="margin-top:20px;font-size:14px;color:#707070">30 sep. 2023</div>
    <sc-for list="{{ movements }}" as="m" hint-placeholder-count="3">
      <div style="display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid #E5E4E4">
        <div style="width:48px;height:48px;flex:none;border-radius:9999px;border:1.5px solid #1E1E23;display:flex;align-items:center;justify-content:center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1E1E23" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="{{ m.icon }}"/></svg></div>
        <div style="flex:1;min-width:0"><div style="font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ m.title }}</div><div style="font-size:14px;color:#707070">{{ m.time }}</div></div>
        <div style="font-family:Poppins,sans-serif;font-weight:700;font-size:16px">{{ m.amount }}</div>
      </div>
    </sc-for>
  </div>
  <div style="position:absolute;left:16px;right:16px;bottom:30px;display:flex;gap:12px;align-items:center">
    <div style="flex:1;height:64px;border-radius:9999px;background:#1E1E23;display:flex;align-items:center;justify-content:space-around;box-shadow:0 8px 24px rgba(43,42,40,.28)">
      <div style="display:flex;flex-direction:column;align-items:center;gap:4px"><svg width="28" height="28" viewBox="0 0 24 24" fill="#AEBCFF"><path d="M6 8a3 3 0 013-3h6a3 3 0 013 3v8a3 3 0 01-3 3H9a3 3 0 01-3-3z"/><path d="M9.5 13.5q2.5 2 5 0" stroke="#1E1E23" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg><span style="width:4px;height:4px;border-radius:9999px;background:#FAFAFA"></span></div>
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FAFAFA" stroke-width="1.6" stroke-linecap="round"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M3 10h18M7 15h3"/></svg>
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FAFAFA" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg>
    </div>
    <button aria-label="WhatsApp" style="width:64px;height:64px;flex:none;border-radius:9999px;border:0;background:#25D366;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 8px 24px rgba(43,42,40,.2)"><svg width="30" height="30" viewBox="0 0 24 24" fill="#FFFFFF"><path d="M12 2a10 10 0 00-8.6 15.1L2 22l5-1.3A10 10 0 1012 2zm5.2 14.1c-.2.6-1.3 1.1-1.8 1.2-.5.1-1 .1-3.2-.8-2.7-1.2-4.400-3.900-4.600-4.100-.1-.2-1.100-1.500-1.100-2.800s.7-2 1-2.300c.2-.3.500-.3.700-.3h.5c.2 0 .4 0 .6.500l.8 2c.1.200.1.400 0 .5l-.4.600-.3.400c-.1.100-.3.300-.1.600.2.300.8 1.300 1.700 2.100 1.200 1 2.100 1.300 2.400 1.500.3.100.5.100.6-.1l.9-1.100c.2-.3.400-.2.600-.1l1.900.9c.3.100.5.200.5.300.100.200.100.700-.1 1.300z"/></svg></button>
  </div>
  <div style="position:absolute;left:50%;bottom:8px;transform:translateX(-50%);width:134px;height:5px;border-radius:9999px;background:#1E1E23"></div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { tab: 0, hidden: false };
  renderVals() {
    const labels = ['Cuentas', 'Cofres', 'Inversiones'];
    const accts = [{ name: 'Principal', last4: '0666', bal: ['$14,094,484', '.00'] }, { name: 'Cofre vacaciones', last4: '0412', bal: ['$82,300', '.00'] }, { name: 'Inversión fija', last4: '0987', bal: ['$250,000', '.00'] }];
    const a = accts[this.state.tab], h = this.state.hidden;
    const mv = [
      { title: 'Fondeo cuenta externa', time: '08:49 h', amount: '$423,434.99', icon: 'M12 3v9m0 0l-3-3m3 3l3-3M4 14v4a2 2 0 002 2h12a2 2 0 002-2v-4' },
      { title: 'Uber SA de CV', time: '08:49 h', amount: '$423,434.99', icon: 'M5 16l1.5-5a2 2 0 012-1.500h7a2 2 0 012 1.500L19 16M4 16h16v3H4zM7 19v1M17 19v1' },
      { title: 'Pago de servicio', time: '08:49 h', amount: '$423,434.99', icon: 'M6 3h12v18l-3-2-3 2-3-2-3 2zM9 8h6M9 12h6' },
    ];
    return {
      tabs: labels.map((label, i) => ({ label, weight: i === this.state.tab ? 700 : 400, bg: i === this.state.tab ? '#1E1E23' : '#FFFFFF', fg: i === this.state.tab ? '#FAFAFA' : '#1E1E23', pick: () => this.setState({ tab: i }) })),
      account: a,
      balanceMain: h ? '$••••••' : a.bal[0],
      balanceCents: h ? '' : a.bal[1],
      slashOpacity: h ? 1 : 0,
      toggleHide: () => this.setState(s => ({ hidden: !s.hidden })),
      goMore: () => { window.location.href = 'Haz mas.dc.html'; },
      goSend: () => { window.location.href = 'Enviar dinero.dc.html'; },
      movements: mv,
    };
  }
}
</script>
</body>
</html>
