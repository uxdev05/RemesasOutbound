<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/bankaool-design-system-e4a58535-11ab-47ad-9339-673141d69251/colors_and_type.css">
<link rel="stylesheet" href="_ds/bankaool-design-system-e4a58535-11ab-47ad-9339-673141d69251/preview/_preview.css">
<script src="_ds/bankaool-design-system-e4a58535-11ab-47ad-9339-673141d69251/_ds_bundle.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap">
<style>body{font-family:Poppins,sans-serif;margin:0;background:#E5E4E4}a{color:#1E1E23}a:hover{color:#707070}button,input,select{font-family:inherit}input::placeholder{color:#ADADAD}input:focus,select:focus{outline:none}</style>
</helmet>
<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box;font-family:Poppins,sans-serif">
<div data-screen-label="05 Configura tu envío" style="position:relative;width:390px;height:844px;background:#FAFAFA;border-radius:44px;overflow:hidden;box-shadow:0 0 0 1px #E5E4E4,0 24px 60px rgba(30,30,35,.18);color:#1E1E23">
  <div style="position:absolute;inset:0;overflow-y:auto;padding:0 24px 150px;scrollbar-width:none">
    <div style="height:54px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 14px 6px;font-weight:600;font-size:16px;margin:0 -24px">
      <span>9:41</span>
      <span style="display:flex;gap:6px;align-items:center"><svg width="18" height="12" viewBox="0 0 18 12" fill="#1E1E23"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="2.5" width="3" height="9.5" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1" opacity=".3"/></svg><svg width="26" height="12" viewBox="0 0 26 12"><rect x=".5" y=".5" width="22" height="11" rx="3.5" fill="none" stroke="#1E1E23" opacity=".4"/><rect x="2" y="2" width="19" height="8" rx="2" fill="#1E1E23"/></svg></span>
    </div>
    <div style="display:flex;align-items:center;justify-content:space-between;height:56px;margin:0 -12px">
      <a href="Ingresa tu monto.dc.html" aria-label="Volver" style="width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:#1E1E23"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></a>
      <div style="display:flex;align-items:center;gap:6px;font-weight:600;font-size:14px;padding-right:8px">Ayuda
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1E1E23" stroke-width="1.6" stroke-linejoin="round"><path d="M12 3a9 9 0 00-7.700 13.600L3 21l4.500-1.200A9 9 0 1012 3z"/><path d="M9 8.500c0 3.500 3 6.500 6.500 6.500l1-2-2.200-1-1 1c-1-.5-2-1.500-2.500-2.500l1-1-1-2.200z" fill="#1E1E23" stroke="none"/></svg></div>
    </div>
    <h1 style="margin:22px 0 0;font-weight:700;font-size:32px;line-height:40px;letter-spacing:-.01em">Configura tu envío</h1>
    <div style="margin-top:24px;background:#E5E4E4;border-radius:12px;overflow:hidden">
      <button onClick="{{ toggle }}" aria-expanded="{{ open }}" style="all:unset;box-sizing:border-box;cursor:pointer;width:100%;height:64px;padding:0 12px;display:flex;align-items:center;justify-content:space-between;font-weight:700;font-size:18px"><span>{{ methodLabel }}</span><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1E1E23" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="transform:rotate({{ rot }}deg)"><path d="M6 9l6 6 6-6"/></svg></button>
      <sc-if value="{{ open }}" hint-placeholder-val="{{ false }}">
        <div style="padding:0 8px 8px;display:flex;flex-direction:column;gap:4px">
          <sc-for list="{{ methods }}" as="m" hint-placeholder-count="3">
            <button onClick="{{ m.pick }}" style="all:unset;box-sizing:border-box;cursor:pointer;width:100%;padding:12px;border-radius:8px;font-size:16px;background:{{ m.bg }};color:{{ m.fg }}" style-hover="background:#1E1E23;color:#FAFAFA">{{ m.name }}</button>
          </sc-for>
        </div>
      </sc-if>
    </div>

    <sc-if value="{{ showForm }}" hint-placeholder-val="{{ false }}">
      <h2 style="margin:32px 0 0;font-weight:700;font-size:16px">Datos de quien recibe</h2>
      <sc-for list="{{ nameFields }}" as="f" hint-placeholder-count="2">
        <div style="margin-top:20px">
          <label style="display:block;font-size:12px;line-height:16px">{{ f.label }}</label>
          <input value="{{ f.value }}" onInput="{{ f.set }}" aria-label="{{ f.label }}" style="width:100%;box-sizing:border-box;height:44px;border:0;border-bottom:1.5px solid #1E1E23;background:transparent;font-size:16px;color:#1E1E23;padding:0">
        </div>
      </sc-for>
      <div style="margin-top:32px">
        <label style="display:block;font-size:12px;line-height:16px">Teléfono</label>
        <div style="display:flex;align-items:flex-end;gap:12px;margin-top:8px">
          <div style="width:22px;height:15px;flex:none;margin-bottom:13px;background:{{ dialFlag }}"></div>
          <div style="position:relative;width:52px;flex:none">
            <select value="{{ dial }}" onChange="{{ setDial }}" aria-label="Lada" style="width:100%;height:40px;border:0;border-bottom:1.5px solid #1E1E23;background:transparent;font-size:16px;color:#707070;padding:0 14px 0 0;appearance:none;-webkit-appearance:none;border-radius:0"><sc-for list="{{ dials }}" as="d" hint-placeholder-count="4"><option value="{{ d }}">{{ d }}</option></sc-for></select>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#1E1E23" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="position:absolute;right:0;top:13px;pointer-events:none"><path d="M6 9l6 6 6-6"/></svg>
          </div>
          <input value="{{ phone }}" onInput="{{ setPhone }}" inputmode="numeric" placeholder="00 0000 0000" aria-label="Teléfono" style="flex:1;min-width:0;height:40px;border:0;border-bottom:1.5px solid #1E1E23;background:transparent;font-size:16px;color:#1E1E23;padding:0">
        </div>
      </div>
      <sc-if value="{{ isAccount }}" hint-placeholder-val="{{ false }}">
        <div style="margin-top:32px">
          <label style="display:block;font-size:12px;line-height:16px">Banco*</label>
          <div style="position:relative">
            <select value="{{ bank }}" onChange="{{ setBank }}" aria-label="Banco" style="width:100%;box-sizing:border-box;height:44px;border:0;border-bottom:1.5px solid #1E1E23;background:transparent;font-size:16px;color:#1E1E23;padding:0 24px 0 0;appearance:none;-webkit-appearance:none;border-radius:0"><option value=""></option><sc-for list="{{ banks }}" as="o" hint-placeholder-count="5"><option value="{{ o }}">{{ o }}</option></sc-for></select>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1E1E23" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="position:absolute;right:0;top:14px;pointer-events:none"><path d="M6 9l6 6 6-6"/></svg>
          </div>
        </div>
        <div style="margin-top:32px">
          <label style="display:block;font-size:12px;line-height:16px">CLABE*</label>
          <input value="{{ clabe }}" onInput="{{ setClabe }}" inputmode="numeric" maxlength="18" aria-label="CLABE" style="width:100%;box-sizing:border-box;height:44px;border:0;border-bottom:1.5px solid {{ clabeLine }};background:transparent;font-size:16px;color:#1E1E23;padding:0">
          <div style="margin-top:6px;font-size:11px;line-height:14px;color:{{ clabeHelpColor }}">CLABE (Mínimo 18 dígitos).</div>
        </div>
      </sc-if>

      <h2 style="margin:32px 0 0;font-weight:700;font-size:16px">Más información (opcional)</h2>
      <p style="margin:8px 0 0;font-size:16px;line-height:22px">Agrega información, si quieres ampliar los datos de la persona destinataria.</p>
      <button onClick="{{ toggleMore }}" role="checkbox" aria-checked="{{ more }}" style="all:unset;box-sizing:border-box;cursor:pointer;width:100%;margin-top:20px;height:70px;padding:0 14px;border-radius:12px;border:1.5px solid #1E1E23;background:{{ moreCardBg }};display:flex;align-items:center;gap:12px;font-weight:700;font-size:14px"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1E1E23" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11V6a1.500 1.500 0 013 0v5M12 10V5a1.500 1.500 0 013 0v6M15 10a1.500 1.500 0 013 0v4a6 6 0 01-6 6h-1a6 6 0 01-5-3l-2-4a1.500 1.500 0 012.500-1.500L9 14V9"/></svg><span style="flex:1">Agregar más información</span><span style="width:22px;height:22px;border-radius:4px;background:{{ moreBg }};border:1.5px solid #1E1E23;box-sizing:border-box;display:flex;align-items:center;justify-content:center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FAFAFA" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="display:{{ moreCheck }}"><path d="M5 12l5 5L20 7"/></svg></span></button>

      <sc-if value="{{ more }}" hint-placeholder-val="{{ false }}">
        <h2 style="margin:32px 0 0;font-weight:700;font-size:20px">Información adicional</h2>
        <sc-for list="{{ extraFields }}" as="f" hint-placeholder-count="11">
          <div style="margin-top:24px">
            <label style="display:block;font-size:12px;line-height:16px">{{ f.label }}</label>
            <div style="position:relative">
              <sc-if value="{{ f.isText }}" hint-placeholder-val="{{ true }}"><input value="{{ f.value }}" onInput="{{ f.set }}" aria-label="{{ f.label }}" style="width:100%;box-sizing:border-box;height:44px;border:0;border-bottom:1.5px solid #1E1E23;background:transparent;font-size:16px;color:#1E1E23;padding:0"></sc-if>
              <sc-if value="{{ f.isSelect }}" hint-placeholder-val="{{ false }}"><select value="{{ f.value }}" onChange="{{ f.set }}" aria-label="{{ f.label }}" style="width:100%;box-sizing:border-box;height:44px;border:0;border-bottom:1.5px solid #1E1E23;background:transparent;font-size:16px;color:#1E1E23;padding:0 24px 0 0;appearance:none;-webkit-appearance:none;border-radius:0"><option value=""></option><sc-for list="{{ f.options }}" as="o" hint-placeholder-count="3"><option value="{{ o }}">{{ o }}</option></sc-for></select><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1E1E23" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="position:absolute;right:0;top:14px;pointer-events:none"><path d="M6 9l6 6 6-6"/></svg></sc-if>
            </div>
          </div>
        </sc-for>
      </sc-if>
    </sc-if>
  </div>
  <div style="position:absolute;left:0;right:0;bottom:0;height:128px;background:linear-gradient(180deg,rgba(250,250,250,0),#FAFAFA 40%);pointer-events:none"></div>
  <div style="position:absolute;left:24px;right:24px;bottom:44px">
    <button onClick="{{ next }}" disabled="{{ nextOff }}" style="width:100%;height:60px;border-radius:9999px;border:0;background:{{ nextBg }};color:{{ nextFg }};font-weight:700;font-size:16px;cursor:pointer">Continuar</button>
  </div>
  <div style="position:absolute;left:50%;bottom:8px;transform:translateX(-50%);width:134px;height:5px;border-radius:9999px;background:#1E1E23"></div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { open: false, method: '', v: {}, dial: '+52', phone: '', bank: '', clabe: '', more: false };
  EXTRA = [
    ['pais', 'País', 'select', ['México', 'Estados Unidos', 'Colombia', 'Venezuela', 'Guatemala']], ['cp', 'Código postal', 'text'], ['estado', 'Estado', 'text'],
    ['ciudad', 'Ciudad', 'text'], ['calle', 'Calle', 'text'], ['num', 'Número', 'text'], ['colonia', 'Colonia', 'text'],
    ['tipoid', 'Tipo ID', 'select', ['INE', 'Pasaporte', 'Licencia']], ['numid', 'Número de identificación', 'text'],
    ['nac', 'Fecha de nacimiento', 'text'], ['nacion', 'Nacionalidad', 'text'],
  ];
  FLAGS = {
    '+52': 'linear-gradient(90deg,#00A859 33%,#FAFAFA 33% 66%,#D80027 66%)',
    '+1': 'repeating-linear-gradient(180deg,#D80027 0 2px,#FAFAFA 2px 4px)',
    '+57': 'linear-gradient(180deg,#FFDA44 50%,#0052B4 50% 75%,#D80027 75%)',
    '+58': 'linear-gradient(180deg,#FFDA44 33%,#0052B4 33% 67%,#D80027 67%)',
    '+502': 'linear-gradient(90deg,#4997D0 33%,#FAFAFA 33% 67%,#4997D0 67%)',
  };
  renderVals() {
    const { open, method, v, dial, phone, bank, clabe, more } = this.state;
    const isAccount = method === 'Depósito a cuenta';
    const setV = key => e => { const val = e.target.value; this.setState(s => ({ v: { ...s.v, [key]: val } })); };
    const mk = ([key, label, type, x]) => ({ label, value: v[key] || '', isText: type === 'text', isSelect: type === 'select', options: type === 'select' ? x : [], set: setV(key) });
    const namesOk = (v.nombre || '').trim() && (v.apellido || '').trim();
    const ok = !!method && namesOk && (!isAccount || (bank && clabe.length === 18));
    const clabeBad = clabe.length > 0 && clabe.length < 18;
    return {
      open, rot: open ? 180 : 0, methodLabel: method || 'Método de envío',
      toggle: () => this.setState({ open: !open }),
      methods: ['Dinero en minutos', 'Depósito a cuenta', 'Depósito a billetera'].map(name => ({
        name, bg: name === method ? '#1E1E23' : 'transparent', fg: name === method ? '#FAFAFA' : '#1E1E23',
        pick: () => this.setState({ method: name, open: false }),
      })),
      showForm: !!method, isAccount,
      nameFields: [mk(['nombre', 'Nombre(s)*', 'text']), mk(['apellido', 'Apellido(s)*', 'text'])],
      dial, dials: Object.keys(this.FLAGS), dialFlag: this.FLAGS[dial],
      setDial: e => this.setState({ dial: e.target.value }),
      phone, setPhone: e => this.setState({ phone: e.target.value.replace(/[^\d ]/g, '').slice(0, 12) }),
      bank, banks: ['BBVA', 'Banorte', 'Santander', 'Banamex', 'HSBC', 'Bankaool'],
      setBank: e => this.setState({ bank: e.target.value }),
      clabe, setClabe: e => this.setState({ clabe: e.target.value.replace(/\D/g, '').slice(0, 18) }),
      clabeLine: clabeBad ? '#FF5C5C' : '#1E1E23', clabeHelpColor: clabeBad ? '#FF5C5C' : '#ADADAD',
      more, moreCardBg: more ? '#D3DBFF' : '#FAFAFA', moreBg: more ? '#1E1E23' : '#FAFAFA', moreCheck: more ? 'block' : 'none',
      toggleMore: () => this.setState({ more: !more }),
      extraFields: this.EXTRA.map(mk),
      nextOff: !ok, nextBg: ok ? '#1E1E23' : '#E5E4E4', nextFg: ok ? '#FAFAFA' : '#ADADAD',
      next: () => {
        if (!ok) return;
        sessionStorage.setItem('bk_name', ((v.nombre || '').trim() + ' ' + (v.apellido || '').trim()).trim());
        sessionStorage.setItem('bk_acct', isAccount ? clabe.slice(-4) : phone.replace(/\D/g, '').slice(-4));
        sessionStorage.setItem('bk_method', method);
        window.location.href = 'Confirmar envio.dc.html';
      },
    };
  }
}
</script>
</body>
</html>
