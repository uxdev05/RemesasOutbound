<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/bankaool-design-system-e4a58535-11ab-47ad-9339-673141d69251/colors_and_type.css">
<link rel="stylesheet" href="_ds/bankaool-design-system-e4a58535-11ab-47ad-9339-673141d69251/preview/_preview.css">
<script src="_ds/bankaool-design-system-e4a58535-11ab-47ad-9339-673141d69251/_ds_bundle.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap">
<style>body{font-family:Poppins,sans-serif;margin:0;background:#E5E4E4}a{color:#FAFAFA}a:hover{color:#D3DBFF}button{font-family:inherit}</style>
</helmet>
<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box;font-family:Poppins,sans-serif">
<div data-screen-label="07 Envío exitoso" style="position:relative;width:390px;height:844px;background:#1E1E23;border-radius:44px;overflow:hidden;box-shadow:0 0 0 1px #E5E4E4,0 24px 60px rgba(30,30,35,.18);color:#FAFAFA">
  <div style="height:54px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 30px 6px 46px;font-weight:600;font-size:16px">
    <span>9:41</span>
    <span style="display:flex;gap:6px;align-items:center"><svg width="18" height="12" viewBox="0 0 18 12" fill="#FAFAFA"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="2.5" width="3" height="9.5" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1" opacity=".3"/></svg><svg width="26" height="12" viewBox="0 0 26 12"><rect x=".5" y=".5" width="22" height="11" rx="3.5" fill="none" stroke="#FAFAFA" opacity=".4"/><rect x="2" y="2" width="19" height="8" rx="2" fill="#FAFAFA"/></svg></span>
  </div>
  <button aria-label="Compartir" style="all:unset;cursor:pointer;position:absolute;right:20px;top:58px;width:44px;height:44px;display:flex;align-items:center;justify-content:center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FAFAFA" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M8 7l4-4 4 4M5 12v6a2 2 0 002 2h10a2 2 0 002-2v-6"/></svg></button>
  <div style="position:absolute;left:73px;top:140px;width:244px;height:239px"><img src="assets/success-illustration.png" alt="" style="width:100%;height:100%;display:block"></div>
  <div style="position:absolute;left:24px;right:24px;top:412px;text-align:center;font-weight:700;font-size:22px;line-height:30px">Enviaste<br>{{ total }} MXN</div>
  <div style="position:absolute;left:24px;right:24px;top:500px;display:flex;justify-content:space-between;font-size:16px"><span>La otra persona recibe</span><span style="font-weight:700">{{ recv }}</span></div>
  <div style="position:absolute;left:24px;right:24px;top:550px;height:74px;box-sizing:border-box;border:1.5px solid #FAFAFA;border-radius:12px;padding:0 16px;display:flex;align-items:center;justify-content:space-between">
    <div><div style="font-size:12px;line-height:18px">Número de seguimiento (MTCN)</div><div style="font-weight:700;font-size:14px;line-height:20px">{{ mtcn }}</div></div>
    <button onClick="{{ copy }}" aria-label="Copiar MTCN" style="all:unset;cursor:pointer;width:44px;height:44px;margin-right:-10px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:2px"><svg width="22" height="22" viewBox="0 0 24 24" fill="#FAFAFA"><rect x="3" y="3" width="13" height="13" rx="3"/><rect x="8" y="8" width="13" height="13" rx="3" stroke="#1E1E23" stroke-width="1.6"/></svg><span style="font-size:10px;display:{{ copiedShow }}">Copiado</span></button>
  </div>
  <div style="position:absolute;left:24px;right:24px;top:666px;display:flex;flex-direction:column;gap:20px">
    <button style="height:62px;border-radius:9999px;border:0;background:#FAFAFA;color:#1E1E23;font-weight:700;font-size:16px;cursor:pointer">Ver comprobante</button>
    <a href="Home.dc.html" style="height:62px;box-sizing:border-box;border-radius:9999px;border:1.5px solid #FAFAFA;color:#FAFAFA;font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center;text-decoration:none">Salir</a>
  </div>
  <div style="position:absolute;left:50%;bottom:8px;transform:translateX(-50%);width:134px;height:5px;border-radius:9999px;background:#FAFAFA"></div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { copied: false };
  renderVals() {
    const ss = k => { try { return sessionStorage.getItem(k); } catch (e) { return null; } };
    const t = parseFloat(ss('bk_total') || '570');
    const mtcn = '3012410231';
    return {
      total: '$' + t.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }),
      recv: ss('bk_recv') || '25.00 USD', mtcn,
      copiedShow: this.state.copied ? 'block' : 'none',
      copy: () => { try { navigator.clipboard.writeText(mtcn); } catch (e) {} this.setState({ copied: true }); setTimeout(() => this.setState({ copied: false }), 1500); },
    };
  }
}
</script>
</body>
</html>
